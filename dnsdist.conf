# -- ==========================================
# -- 4. БЛОКИРОВКА РЕКЛАМЫ (Опционально)
# -- ==========================================
# -- Я оставил этот блок, он полезен. 
# -- Блокируем известные трекеры, чтобы они даже не грузились.
addAction(QNameSuffixRule({
    'googlesyndication.com.', 
    'adcolony.com.', 
    'hotjar.com.', 
    'mouseflow.com.', 
    'doubleclick.net.', 
    'media.net.',
    'crm.yandex.ru.',
    'an.yandex.ru.'
}), DropAction())
