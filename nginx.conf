# ==========================================
# 1. НАСТРОЙКИ ПРОИЗВОДИТЕЛЬНОСТИ
# ==========================================
user  nginx;
worker_processes  auto;

# Увеличиваем лимиты открытых файлов (как в оригинале)
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Позволяет обрабатывать много соединений одновременно
    worker_connections 32768;
    use epoll;
    multi_accept on;
}

# ==========================================
# 2. ЛОГИКА ПРОКСИРОВАНИЯ (TCP/UDP)
# ==========================================
stream {
    # Настройки хешей для быстрой работы map
    map_hash_bucket_size 256;

    # Используем Google DNS для резолвинга реальных IP сайтов.
    # 127.0.0.11 (Docker DNS) может не работать в режиме network_mode: "host",
    # поэтому надежнее использовать 8.8.8.8
    resolver 8.8.8.8 ipv6=off valid=300s;

    # ------------------------------------------
    # Ссылка на твою Amnezia (спрятана на порту 4443)
    # ------------------------------------------
    upstream amnezia_backend {
        server 127.0.0.1:4443;
    }

    # ------------------------------------------
    # ГЛАВНЫЙ СОРТИРОВЩИК
    # ------------------------------------------
    map $ssl_preread_server_name $target_backend {
        # === ЗОНА VPN ===
        # Вписываем сюда домен (SNI), который стоит в клиенте Amnezia!
        # Трафик с этим именем пойдет во внутренний порт 4443.
        "http://business.max.ru"        amnezia_backend;
        
        # Если SNI пустой (бывает у старых VPN клиентов)
        ""                  amnezia_backend;

        # === ЗОНА ИНТЕРНЕТА (WARP) ===
        # Любой другой домен отправляем напрямую в интернет (на порт 443 реального сайта)
        # Это реализует твою идею "Проксировать все сайты".
        default             $ssl_preread_server_name:443;
    }

    # ------------------------------------------
    # СЕРВЕР (Слушаем порт 443)
    # ------------------------------------------
    server {
        listen      443;
        
        # Включаем подглядывание за именем домена (SNI)
        ssl_preread on;
        
        # Пересылаем туда, куда решил map (в VPN или в Интернет)
        proxy_pass  $target_backend;
        
        # Тайм-ауты (важно для стриминга и длинных сессий)
        proxy_connect_timeout 10s;
        proxy_timeout 24h; # Увеличили до суток, чтобы VPN не рвался
    }
}